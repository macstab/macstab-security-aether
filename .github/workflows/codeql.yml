# Light CodeQL job (same idea as chaos codeql.yml)
name: codeql

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (cpp)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp

      - name: Build
        env:
          AETHER_LICENSE_ACCEPTED: I_ACCEPT_AETHER_LICENSE
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 2 --target aether_core aether_morph aether_bench

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
